<!DOCTYPE html>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase Client -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#0c4a6e',
              dark: '#0d1117',
              card: '#161b22',
              border: '#30363d'
            }

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&family=Inter:wght@400;600;700&display=swap');
    body {
      font-family: 'Vazirmatn', 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .slider-comparison-container {
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .slider-overlay-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen pb-20 select-none">

        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="syncText">ئۆنلاین</span>
      </div>
    </div>
  </header>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main id="appContent" class="max-w-md mx-auto p-4 space-y-4">
    <!-- Content injected dynamically via JavaScript -->
  </main>

  <!-- BOTTOM NAVIGATION BAR (Android Ergonomic Friendly) -->

    <div class="max-w-md mx-auto grid grid-cols-5 gap-1 text-center">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn py-1 px-2 rounded-xl flex flex-col items-center justify-center text-brand-400 font-semibold text-[11px] transition">
        <i data-lucide="layout-dashboard" class="w-5 h-5 mb-0.5"></i>

      </button>
      <button onclick="switchTab('jobs')" id="nav-jobs" class="nav-btn py-1 px-2 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 text-[11px] transition">
        <i data-lucide="wrench" class="w-5 h-5 mb-0.5"></i>
        <span data-i18n="nav_jobs">کارەکان</span>
      </button>
      <button onclick="switchTab('customers')" id="nav-customers" class="nav-btn py-1 px-2 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 text-[11px] transition">
        <i data-lucide="users" class="w-5 h-5 mb-0.5"></i>
        <span data-i18n="nav_customers">موشتەری</span>

      <button onclick="switchTab('portfolio')" id="nav-portfolio" class="nav-btn py-1 px-2 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 text-[11px] transition">

        <span data-i18n="nav_portfolio">پۆرتفۆلیۆ</span>
      </button>
      <button onclick="switchTab('finance')" id="nav-finance" class="nav-btn py-1 px-2 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 text-[11px] transition">
        <i data-lucide="wallet" class="w-5 h-5 mb-0.5"></i>

    let currentLang = localStorage.getItem('awena_lang') || 'ckb';

    /* =====================================================================

    const DEFAULT_SERVICES = [

        }
      ],

          id: 'p1',

          service: 'تەعدیلی دوو قۆناغ + سیرامیک کۆتینگ',
          before: 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=600&q=80',

    function persistLocal() {
      localStorage.setItem('awena_customers', JSON.stringify(db.customers));
      localStorage.setItem('awena_vehicles', JSON.stringify(db.vehicles));
      localStorage.setItem('awena_jobs', JSON.stringify(db.jobs));
      localStorage.setItem('awena_portfolio', JSON.stringify(db.portfolio));
    }

    /* =====================================================================
       LANGUAGE & TRANSLATION CONTROLLER
       ===================================================================== */
    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('awena_lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = I18N[lang].dir;
      document.getElementById('langLabel').innerText = lang === 'ckb' ? 'English' : 'کوردی';
      document.getElementById('headerSubtitle').innerText = I18N[lang].subtitle;

      // Update static data attributes
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang][key]) el.innerText = I18N[lang][key];
      });

      renderCurrentTab();
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'ckb' ? 'en' : 'ckb');
    }

    /* =====================================================================
       NAVIGATION CONTROLLER
       ===================================================================== */
    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-brand-400');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-brand-400');
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('appContent');
      if (currentTab === 'dashboard') renderDashboard(container);
      else if (currentTab === 'jobs') renderJobs(container);
      else if (currentTab === 'customers') renderCustomers(container);
      else if (currentTab === 'portfolio') renderPortfolio(container);
      else if (currentTab === 'finance') renderFinance(container);
      lucide.createIcons();
    }

    /* =====================================================================
       1. DASHBOARD VIEW
       ===================================================================== */
    function renderDashboard(container) {
      const t = I18N[currentLang];
      
      const totalCustomers = db.customers.length;
      const totalVehicles = db.vehicles.length;
      const activeJobs = db.jobs.filter(j => !['completed', 'delivered', 'cancelled'].includes(j.status)).length;
      const completedJobs = db.jobs.filter(j => j.status === 'completed' || j.status === 'delivered').length;
      
      let totalRevenue = 0;
      let totalUnpaid = 0;
      db.jobs.forEach(j => {
        totalRevenue += (j.amountPaid || 0);
        totalUnpaid += Math.max(0, (j.finalAmount - (j.amountPaid || 0)));
      });

      container.innerHTML = `
        <!-- Metrics Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-brand-card p-3.5 rounded-2xl border border-brand-border shadow-sm">
            <div class="flex items-center justify-between text-slate-400 mb-2">
              <span class="text-xs">${t.active_jobs}</span>
              <i data-lucide="activity" class="w-4 h-4 text-amber-400"></i>
            </div>
            <div class="text-2xl font-black text-amber-400">${activeJobs}</div>
            <span class="text-[10px] text-slate-500">${completedJobs} ${t.completed_jobs}</span>
          </div>

          <div class="bg-brand-card p-3.5 rounded-2xl border border-brand-border shadow-sm">
            <div class="flex items-center justify-between text-slate-400 mb-2">
              <span class="text-xs">${t.unpaid_balances}</span>
              <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400"></i>
            </div>
            <div class="text-xl font-black text-rose-400">${totalUnpaid.toLocaleString()} <span class="text-xs">${t.iqd}</span></div>
            <span class="text-[10px] text-slate-500">${totalRevenue.toLocaleString()} ${t.iqd} داهات</span>
          </div>

          <div class="bg-brand-card p-3 rounded-xl border border-brand-border flex items-center justify-between">
            <div>
              <span class="text-[11px] text-slate-400 block">${t.total_customers}</span>
              <span class="text-lg font-bold">${totalCustomers}</span>
            </div>
            <i data-lucide="users" class="w-5 h-5 text-sky-400"></i>
          </div>

          <div class="bg-brand-card p-3 rounded-xl border border-brand-border flex items-center justify-between">
            <div>
              <span class="text-[11px] text-slate-400 block">${t.total_vehicles}</span>
              <span class="text-lg font-bold">${totalVehicles}</span>
            </div>
            <i data-lucide="car" class="w-5 h-5 text-indigo-400"></i>
          </div>
        </div>

        <!-- Quick Action Buttons -->
        <div class="bg-brand-card p-3.5 rounded-2xl border border-brand-border space-y-2">
          <span class="text-xs font-semibold text-slate-400 block">${t.quick_actions}</span>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="openNewJobModal()" class="flex items-center justify-center gap-2 py-3 px-4 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-sky-600/30 transition">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>${t.new_job}</span>
            </button>
            <button onclick="openNewCustomerModal()" class="flex items-center justify-center gap-2 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl border border-brand-border transition">
              <i data-lucide="user-plus" class="w-4 h-4"></i>
              <span>${t.new_customer}</span>
            </button>
          </div>
        </div>

        <!-- Fast Search Bar -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute top-3.5 start-3 text-slate-400"></i>
          <input type="text" oninput="handleUniversalSearch(this.value)" placeholder="${t.search_placeholder}" 
                 class="w-full bg-brand-card border border-brand-border rounded-xl py-2.5 ps-9 pe-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500">
        </div>

        <!-- Recent Detailing Jobs -->
        <div class="space-y-2">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-xs font-bold text-slate-300">دوایین کارەکان (Recent Jobs)</h2>
            <button onclick="switchTab('jobs')" class="text-[11px] text-brand-400 hover:underline">بینینی هەمووی</button>

          <div class="space-y-2.5" id="dashboardJobsList">
            ${renderJobsListSnippet(db.jobs.slice(-5).reverse())}
          </div>

      `;

    /* Helper: Render List of Jobs */
    function renderJobsListSnippet(jobsList) {
      const t = I18N[currentLang];
      if (jobsList.length === 0) {
        return `<p class="text-xs text-slate-500 text-center py-4">هیچ کارێک تۆمار نەکراوە</p>`;
      }
      return jobsList.map(job => {
        const customer = db.customers.find(c => c.id === job.customer_id) || { name: 'نەزانراو', phone: '' };
        const vehicle = db.vehicles.find(v => v.id === job.vehicle_id) || { make: '', model: '', plate: '' };
        const remaining = (job.finalAmount || 0) - (job.amountPaid || 0);

        return `
          <div onclick="openJobDetail('${job.id}')" class="bg-brand-card p-3 rounded-xl border border-brand-border active:scale-[0.98] transition cursor-pointer">
            <div class="flex items-start justify-between">
              <div>

    function shareWhatsAppReceipt(jobId) {

      const customer = db.customers.find(c => c.id === job.customer_id);
      const vehicle = db.vehicles.find(v => v.id === job.vehicle_id);
      const remaining = (job.finalAmount || 0) - (job.amountPaid || 0);

      const message = `*پسوڵەی فەرمی جوانکاری ئۆتۆمبێلی AWENA CAR - هەڵەبجە*
---------------------------------------
کاک/خاتوو: ${customer ? customer.name : ''}
ئۆتۆمبێل: ${vehicle ? vehicle.make + ' ' + vehicle.model : ''}
تابلۆ: ${vehicle ? vehicle.plate : ''}
ژمارەی کار: #JOB-${job.jobNumber}
خزمەتگوزاری: ${job.services ? job.services.join('، ') : 'پۆڵیش و نانۆ سیرامیک'}
---------------------------------------
نرخی خزمەتگوزاری: ${job.totalPrice ? job.totalPrice.toLocaleString() : 0} دینار
داشکاندن: ${job.discount ? job.discount.toLocaleString() : 0} دینار
کۆی گشتی: ${job.finalAmount ? job.finalAmount.toLocaleString() : 0} دینار
بڕی دراو: ${job.amountPaid ? job.amountPaid.toLocaleString() : 0} دینار
قەرزی ماوە: ${remaining.toLocaleString()} دینار
---------------------------------------
سوپاس بۆ متمانەکەتان بە AWENA CAR!
ناونیشان: هەڵەبجە - پەیوەندی: 07501234567`;

      const encoded = encodeURIComponent(message);
      const phoneClean = customer && customer.whatsapp ? customer.whatsapp.replace(/[^0-9]/g, '') : '';
      window.open(`https://api.whatsapp.com/send?phone=${phoneClean}&text=${encoded}`, '_blank');
    }

      const newVehId = 'v-' + Date.now();

      const newCustomer = {
        id: newCustId,
        name: document.getElementById('cust_name').value,
        phone: document.getElementById('cust_phone').value,

        customer_id: newCustId,
        make: document.getElementById('veh_model').value.split(' ')[0] || 'ئۆتۆمبێل',

        year: parseInt(document.getElementById('veh_year').value) || 2024,
        plate: document.getElementById('veh_plate').value,

      db.customers.unshift(newCustomer);
      db.vehicles.unshift(newVehicle);
      persistLocal();
      closeModal();
      renderCurrentTab();

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function recalculateJobFormTotal() {
      let sum = 0;
      document.querySelectorAll('input[name="services"]:checked').forEach(cb => {
        sum += parseFloat(cb.getAttribute('data-price')) || 0;
      });
      document.getElementById('job_calc_price').value = sum;
    }

    function handleNewJobSubmit(e) {
      e.preventDefault();
      const vehId = document.getElementById('new_job_veh').value;
      const vehicle = db.vehicles.find(v => v.id === vehId);
      if (!vehicle) return;

      const selectedServices = [];
      document.querySelectorAll('input[name="services"]:checked').forEach(cb => {
        selectedServices.push(cb.value);
      });

      const totalPrice = parseFloat(document.getElementById('job_calc_price').value) || 0;
      const discount = parseFloat(document.getElementById('job_discount').value) || 0;
      const amountPaid = parseFloat(document.getElementById('job_paid').value) || 0;
      const paymentMethod = document.getElementById('job_payment_type').value;

      const newJob = {
        id: 'job-' + Date.now(),
        jobNumber: db.jobs.length + 101,
        customer_id: vehicle.customer_id,
        vehicle_id: vehId,
        status: 'received',
        services: selectedServices.length > 0 ? selectedServices : ['Detailing Service'],
        totalPrice: totalPrice,
        discount: discount,
        finalAmount: totalPrice - discount,
        amountPaid: amountPaid,
        currency: 'IQD',
        paymentMethod: paymentMethod,
        receivedDate: new Date().toISOString().split('T')[0],
        photos: { before: [], after: [] }
      };

      db.jobs.unshift(newJob);
      persistLocal();
      closeModal();
      switchTab('jobs');
    }

    /* =====================================================================
       4. PUBLIC PORTFOLIO SHOWCASE
       ===================================================================== */
    function renderPortfolio(container) {
      const t = I18N[currentLang];
      container.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div>
            <h2 class="text-base font-bold text-white">${t.nav_portfolio}</h2>
            <p class="text-[11px] text-slate-400">کارە بڵاوکراوەکان بۆ نیشاندان بە موشتەری</p>
          </div>
          <span class="text-[10px] bg-brand-900/60 text-brand-400 border border-brand-500/30 px-2 py-0.5 rounded-full font-semibold">گشتی (Public)</span>
        </div>

        <div class="space-y-4">
          ${db.portfolio.map(item => `
            <div class="bg-brand-card rounded-2xl border border-brand-border overflow-hidden">
              <div class="slider-comparison-container h-52 bg-black relative">
                <img src="${item.after}" class="w-full h-full object-cover">
                <div class="slider-overlay-img overflow-hidden" id="port-overlay-${item.id}" style="width: 50%;">
                  <img src="${item.before}" class="w-full h-full object-cover" style="width: calc(100vw - 32px); max-width: 414px;">
                </div>
                <input type="range" min="0" max="100" value="50" oninput="document.getElementById('port-overlay-${item.id}').style.width = this.value + '%'" 
                       class="absolute inset-0 w-full h-full opacity-0 cursor-ew-resize">
                <span class="absolute bottom-2 start-2 text-[9px] bg-black/70 px-1.5 py-0.5 rounded text-white pointer-events-none">پێش کار</span>
                <span class="absolute bottom-2 end-2 text-[9px] bg-sky-600/80 px-1.5 py-0.5 rounded text-white pointer-events-none">دوای کار</span>
              </div>
              <div class="p-3 space-y-1">
                <h3 class="font-extrabold text-sm text-white">${item.vehicle}</h3>
                <p class="text-xs text-brand-400 font-medium">${item.service}</p>
                <p class="text-[11px] text-slate-400 pt-1">${item.desc}</p>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    /* Modal for Publishing a Job to the Public Showcase */
    function publishToPortfolioModal(jobId) {
      const job = db.jobs.find(j => j.id === jobId);
      if (!job) return;
      const vehicle = db.vehicles.find(v => v.id === job.vehicle_id);

      const modal = document.getElementById('appModal');
      const container = document.getElementById('modalContainer');

      container.innerHTML = `
        <div class="flex items-center justify-between border-b border-brand-border pb-3">
          <h3 class="font-bold text-base text-white">بڵاوکردنەوە لە پۆرتفۆلیۆ</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="space-y-3 text-xs">
          <div class="p-2.5 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-300 text-[11px]">
            ⚠️ تکایە دڵنیابە لە ڕەزامەندی موشتەری و شاردنەوەی ژمارەی تابلۆ پێش بڵاوکردنەوەی وێنەکان.
          </div>

          <div>
            <label class="text-slate-300 font-semibold block mb-1">ناونیشانی کار</label>
            <input type="text" id="port_title" value="${vehicle ? vehicle.make + ' ' + vehicle.model : ''}" class="w-full bg-slate-800 border border-brand-border rounded-xl p-2.5 text-white">
          </div>

          <div>
            <label class="text-slate-300 font-semibold block mb-1">شیکردنەوەی کار بە کوردی</label>
            <textarea id="port_desc" rows="2" class="w-full bg-slate-800 border border-brand-border rounded-xl p-2 text-white">پۆڵیش و نانۆ سیرامیکی ئاست بەرز بۆ پاراستنی بۆیاخ لە شوێنکاری ئاوێنە کار - هەڵەبجە</textarea>
          </div>

          <label class="flex items-center gap-2 text-slate-200 cursor-pointer pt-1">
            <input type="checkbox" id="port_consent" required class="rounded bg-slate-800 border-slate-700 text-brand-500">
            <span>موشتەری ڕەزامەندی دەربڕیوە بۆ بڵاوکردنەوە</span>
          </label>

          <button onclick="confirmPublishPortfolio('${job.id}')" class="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl mt-2">
            بڵاوکردنەوەی فەرمی
          </button>
        </div>
      `;

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function confirmPublishPortfolio(jobId) {
      const consent = document.getElementById('port_consent').checked;
      if (!consent) {
        alert('تکایە پێشوەختە ڕەزامەندی موشتەری پشتڕاست بکەرەوە');
        return;
      }
      const job = db.jobs.find(j => j.id === jobId);
      const vehicle = db.vehicles.find(v => v.id === job.vehicle_id);

      db.portfolio.unshift({
        id: 'port-' + Date.now(),
        vehicle: document.getElementById('port_title').value,
        service: job.services ? job.services[0] : 'Detailing',
        before: job.photos && job.photos.before && job.photos.before[0] ? job.photos.before[0] : 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=600&q=80',
        after: job.photos && job.photos.after && job.photos.after[0] ? job.photos.after[0] : 'https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=600&q=80',
        desc: document.getElementById('port_desc').value
      });

      persistLocal();
      closeModal();
      switchTab('portfolio');
    }

    /* =====================================================================
       5. FINANCIAL MANAGEMENT VIEW & BACKUP EXPORTER
       ===================================================================== */
    function renderFinance(container) {
      const t = I18N[currentLang];
      let totalRevenue = 0;
      let totalUnpaid = 0;
      let totalDiscount = 0;

      db.jobs.forEach(j => {
        totalRevenue += (j.amountPaid || 0);
        totalDiscount += (j.discount || 0);
        totalUnpaid += Math.max(0, ((j.finalAmount || 0) - (j.amountPaid || 0)));
      });

      container.innerHTML = `
        <h2 class="text-base font-bold text-white mb-3">${t.nav_finance}</h2>

        <div class="bg-brand-card p-4 rounded-2xl border border-brand-border space-y-3">
          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-400">داهاتی کۆکراوە (Cash Received):</span>
            <span class="font-black text-emerald-400 text-sm">${totalRevenue.toLocaleString()} ${t.iqd}</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-400">قەرزی لای موشتەری (Outstanding):</span>
            <span class="font-black text-rose-400 text-sm">${totalUnpaid.toLocaleString()} ${t.iqd}</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-400">سەرجەم داشکاندنەکان:</span>
            <span class="font-bold text-slate-300 text-xs">${totalDiscount.toLocaleString()} ${t.iqd}</span>
          </div>
        </div>

        <!-- Data Safety & Offline Backups -->
        <div class="bg-brand-card p-4 rounded-2xl border border-brand-border space-y-3 mt-4">
          <div class="flex items-center gap-2">
            <i data-lucide="shield-check" class="w-5 h-5 text-sky-400"></i>
            <h3 class="text-xs font-bold text-white">پاراستن و هەناردەکردنی داتا (Backup & Export)</h3>
          </div>
          <p class="text-[11px] text-slate-400">هەموو زانیارییەکان لە ناو مۆبایلەکەتدا دەپارێزرێن. دەتوانیت فایلی یەدەگ (JSON) داگرێت بۆ پاراستنی دەستی.</p>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="exportDataBackup()" class="py-2.5 px-3 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 shadow">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>داگرتنی بەکئەپ</span>
            </button>
            <label class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl border border-brand-border flex items-center justify-center gap-1.5 cursor-pointer">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>گەڕاندنەوە</span>
              <input type="file" accept=".json" onchange="importDataBackup(event)" class="hidden">
            </label>
          </div>
        </div>
      `;
    }

    /* Backup Exporter: JSON with structured relational snapshot */
    function exportDataBackup() {
      const backupData = {
        app: "AWENA CAR Auto Detailing",
        version: "1.2",
        exportedAt: new Date().toISOString(),
        location: "Halabja, Kurdistan Region, Iraq",
        database: db
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `AWENA_CAR_BACKUP_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    /* Backup Importer with Validation */
    function importDataBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.database && imported.database.jobs) {
            db = imported.database;
            persistLocal();
            alert('داتاکان بە سەرکەوتوویی گەڕێنرانەوە!');
            renderCurrentTab();
          } else {
            alert('فایلەکە هەڵەیە یان فۆرماتیگونجاو نییە.');
          }
        } catch(err) {
          alert('هەڵە لە خوێندنەوەی فایلەکە: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    /* Universal Fast Search (Plates, Names, Phones) */
    function handleUniversalSearch(query) {
      if (!query.trim()) {
        renderCurrentTab();
        return;
      }
      const q = query.toLowerCase().trim();
      const matchedJobs = db.jobs.filter(job => {
        const cust = db.customers.find(c => c.id === job.customer_id);
        const veh = db.vehicles.find(v => v.id === job.vehicle_id);
        return (
          (veh && veh.plate.toLowerCase().includes(q)) ||
          (veh && (veh.make + ' ' + veh.model).toLowerCase().includes(q)) ||
          (cust && cust.name.toLowerCase().includes(q)) ||
          (cust && cust.phone.includes(q)) ||
          String(job.jobNumber).includes(q)
        );
      });

      const listContainer = document.getElementById('dashboardJobsList') || document.getElementById('allJobsContainer');
      if (listContainer) {
        listContainer.innerHTML = renderJobsListSnippet(matchedJobs);
      }
    }

    /* Camera Capture Trigger */
    function triggerPhotoCapture(jobId) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment'; // Android Hardware Camera Direct
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const job = db.jobs.find(j => j.id === jobId);
            if (job) {
              if (!job.photos) job.photos = { before: [], after: [] };
              job.photos.after = [event.target.result];
              persistLocal();
              openJobDetail(jobId);
            }
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    function closeModal() {
      document.getElementById('appModal').classList.add('hidden');
    }

    /* PWA Service Worker Registration */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration skipped:', err));
      });
    }

    // Initialize View
    setLanguage(currentLang);
  </script>
